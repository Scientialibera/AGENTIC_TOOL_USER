[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-framework"
version = "1.0.0"
description = "Advanced Text-to-SQL Bot using Microsoft Agent Framework and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Team", email = "contact@generai.ca"}
]
keywords = ["agent", "mcp", "sql", "llm", "azure", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # MCP and Web Framework
    "fastmcp>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # Configuration and Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",  # TOML support for Python < 3.11

    # Azure Services
    "azure-identity>=1.15.0",
    "azure-cosmos>=4.5.0",
    "openai>=1.0.0",

    # HTTP and Networking
    "httpx>=0.25.0",

    # Logging and Utilities
    "structlog>=23.0.0",
    "tenacity>=8.2.0",

    # Database Clients
    "pyodbc>=5.0.0",

    # Text Processing and Matching
    "rapidfuzz>=3.0.0",

    # Authentication
    "PyJWT[crypto]>=2.8.0",

    # SQL Parsing (for RBAC)
    "sqlglot>=20.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/Scientialibera/AGENTIC_TOOL_USER"
Repository = "https://github.com/Scientialibera/AGENTIC_TOOL_USER"
Documentation = "https://github.com/Scientialibera/AGENTIC_TOOL_USER/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["agentic_framework"]

[tool.pytest.ini_options]
testpaths = ["agentic_framework/tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=agentic_framework",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "gremlinpython.*",
    "pyodbc.*",
    "fastmcp.*",
]
ignore_missing_imports = true
